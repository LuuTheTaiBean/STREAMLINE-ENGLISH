<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Content</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }

        .editor-container {
            max-width: 900px;
            margin: auto;
        }

        .editor-box {
            border-radius: 12px;
            overflow: hidden;
        }

        textarea {
            resize: none;
            border: none;
            outline: none;
            width: 100%;
            height: 350px;
            padding: 15px;
            font-size: 16px;
            font-family: "Times New Roman", serif;
        }

        .preview-box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            min-height: 150px;
            border: 1px solid #ddd;
        }

        .toolbar {
            background: #f1f3f5;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .btn-save {
            min-width: 120px;
        }
    </style>
</head>

<body class="p-4">

    <div class="editor-container">

        <!-- HEADER -->
        <div class="card p-3 mb-3 shadow-sm">
            <h5 class="fw-bold mb-2">📄 Thông tin bài làm</h5>

            <p class="mb-1"><strong>Họ tên:</strong> <span id="studentName"></span></p>
            <p class="mb-1"><strong>Unit:</strong> <span id="unit"></span></p>
            <p class="mb-1"><strong>Ngày nộp:</strong> <span id="submittedTime"></span></p>
            <span class="badge bg-secondary" id="status">Not saved</span>
        </div>

        <!-- EDITOR -->
        <div class="card editor-box shadow-sm">

            <!-- TEXTAREA -->
            <textarea id="editor"></textarea>

        </div>

        <!-- ACTION -->
        <div class="d-flex justify-content-between mt-3">
            <button id="saveBtn" class="btn btn-success btn-save">
                💾 Save
            </button>

        </div>

    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { doc, updateDoc, getDoc }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const params = new URLSearchParams(window.location.search);
        const docId = params.get("docId");
        const tabName = params.get("tab");
        const content = decodeURIComponent(params.get("content") || "");

        const editor = document.getElementById("editor");
        const preview = document.getElementById("preview");
        const status = document.getElementById("status") || {
            innerText: "",
            className: ""
        };

        editor.value = content;

        // save
        document.getElementById("saveBtn").addEventListener("click", async () => {
            try {
                status.innerText = "Saving...";
                status.className = "badge bg-warning";

                const docRef = doc(db, "submissions", docId);
                const snap = await getDoc(docRef);

                if (!snap.exists()) {
                    alert("Không tìm thấy dữ liệu!");
                    return;
                }

                const data = snap.data();
                const notes = data.notes;

                Object.values(notes).forEach(tab => {
                    if (tab.name === tabName) {
                        tab.content = editor.value;
                    }
                });

                await updateDoc(docRef, {
                    notes: notes
                });

                status.innerText = "Saved";
                status.className = "badge bg-success";

            } catch (err) {
                console.error(err);
                status.innerText = "Error";
                status.className = "badge bg-danger";
            }
        });

        // ===== TOOL FUNCTIONS =====
        window.wrapText = function (start, end) {
            const textarea = editor;
            const startPos = textarea.selectionStart;
            const endPos = textarea.selectionEnd;

            const text = textarea.value;
            const selected = text.substring(startPos, endPos);

            const newText =
                text.substring(0, startPos) +
                start + selected + end +
                text.substring(endPos);

            textarea.value = newText;
        };

        window.insertBreak = function () {
            const textarea = editor;
            const pos = textarea.selectionStart;

            const text = textarea.value;
            textarea.value =
                text.substring(0, pos) +
                "<br>" +
                text.substring(pos);
        };

        const name = decodeURIComponent(params.get("name") || "Unknown");
        const time = params.get("time");
        const unit = decodeURIComponent(params.get("unit") || "");

        // format thời gian
        function formatTime(seconds) {
            if (!seconds) return "Unknown";

            const date = new Date(seconds * 1000);

            return date.toLocaleString("vi-VN");
        }

        // render UI
        document.getElementById("studentName").innerText = name;
        document.getElementById("unit").innerText = unit;
        document.getElementById("submittedTime").innerText = formatTime(time);
    </script>
</body>

</html>
