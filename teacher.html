<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .content-scroll {
            max-height: 200px;
            /* 👈 chiều cao phần nội dung */
            overflow-y: auto;
            padding-right: 5px;
        }

        .content-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .content-scroll::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .content-scroll p {
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<body class="p-4">
    <h2>Student Notebooks</h2>

    <div id="submissionList" class="mt-4"></div>

    <script type="module">import { db } from "./firebase-config.js";
        import {
            collection,
            getDocs,
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { auth } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        // import { Document, Packer, Paragraph, TextRun } from "docx";
        import {
            Document,
            Packer,
            Paragraph,
            TextRun
        } from "https://cdn.jsdelivr.net/npm/docx@8.5.0/+esm";
        async function exportToWord(data) {
            const paragraphs = [];
            Object.values(data.notes).forEach((tab) => {
                // 1. Convert HTML -> text có xuống dòng
                const textWithBreaks = tab.content
                    .replace(/<\/p>/g, "\n")   // </p> -> xuống dòng
                    .replace(/<br\s*\/?>/g, "\n") // <br> -> xuống dòng
                    .replace(/<[^>]+>/g, "");  // remove tag còn lại

                // 2. Split thành từng dòng
                const lines = textWithBreaks.split("\n");

                // 3. Mỗi dòng = 1 paragraph
                lines.forEach(line => {
                    if (line.trim() !== "") {
                        paragraphs.push(
                            new Paragraph({
                                children: [
                                    new TextRun({
                                        text: line,
                                        font: "Times New Roman",
                                        size: 24
                                    })
                                ]
                            })
                        );
                    }
                });
            });


            const doc = new Document({
                sections: [{ children: paragraphs }]
            });

            const blob = await Packer.toBlob(doc);

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");

            a.href = url;
            const fileName = formatFileName(data);
            a.download = fileName;
            a.click();
        }
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                alert("Bạn chưa đăng nhập!");
                window.location.href = "login.html";
                return;
            }

            // Lấy role từ Firestore
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                alert("Không tìm thấy user!");
                window.location.href = "login.html";
                return;
            }

            const userData = userSnap.data();

            // ❌ Nếu không phải teacher/admin → chặn
            if (userData.role !== "teacher" && userData.role !== "admin") {
                alert("Bạn không có quyền truy cập!");
                window.location.href = "index.html";
                return;
            }

            // ✅ Có quyền → load dữ liệu
            loadSubmissions();
        });
        // 👉 LOAD DATA
        async function loadSubmissions() {
            const container = document.getElementById("submissionList");
            container.innerHTML = "";
            container.className = "row";
            const snap = await getDocs(collection(db, "submissions"));

            snap.forEach((docSnap) => {
                const data = docSnap.data();

                const div = document.createElement("div");
                div.className = "col-md-4 mb-3"; // ✅ 3 cột / hàng

                const card = document.createElement("div");
                card.className = "card p-3 h-100"; // h-100 cho đều chiều cao

                let contentHTML = "";

                Object.values(data.notes).forEach((tab) => {
                    contentHTML += `
        <h5>${tab.name}</h5>
        <p>${tab.content}</p>
      `;
                });

                card.innerHTML = `
                <div class="mb-2">
                    <p><strong>Name:</strong> ${data.userName || "Unknown"}</p>
                    <p><strong>Email:</strong> ${data.userEmail}</p>
                    <p><strong>Submitted:</strong> ${formatTime(data.submittedAt)}</p>
                </div>

                <div class="content-scroll">
                    ${contentHTML}
                </div>

                <button class="btn btn-success w-100 mt-2 exportBtn">Export Word</button>
                `;
                div.appendChild(card);
                container.appendChild(div);

                div.querySelector(".exportBtn").addEventListener("click", () => {
                    exportToWord(data);
                });
            });
        }

        // loadSubmissions();

        function formatTime(timestamp) {
            if (!timestamp) return "Unknown";

            // Firestore Timestamp → Date
            const date = timestamp.seconds
                ? new Date(timestamp.seconds * 1000)
                : new Date(timestamp);

            return date.toLocaleString("vi-VN");
        }
        function formatFileTime(timestamp) {
            if (!timestamp) return "unknown-time";

            const date = timestamp.seconds
                ? new Date(timestamp.seconds * 1000)
                : new Date(timestamp);

            const dd = String(date.getDate()).padStart(2, "0");
            const mm = String(date.getMonth() + 1).padStart(2, "0");
            const yyyy = date.getFullYear();

            const hh = String(date.getHours()).padStart(2, "0");
            const min = String(date.getMinutes()).padStart(2, "0");

            return `${hh}-${min} ${dd}-${mm}-${yyyy}`;
        }
        function formatFileName(data) {
            const name = (data.userName || "Unknown").replace(/[\\/:*?"<>|]/g, "");
            const unit = (data.unitId || "").replace(/[\\/:*?"<>|]/g, "");

            // Giả sử unit dạng: book1_unit1
            let book = "UnknownBook";
            let unitPart = unit;

            if (unit.includes("_")) {
                const parts = unit.split("_");
                book = parts[0] || "UnknownBook";
                unitPart = parts.slice(1).join("_") || "UnknownUnit";
            }

            const time = formatFileTime(data.submittedAt);

            return `${book}-${unitPart} ${name} ${time}.docx`;
        }
    </script>
</body>

</html>
